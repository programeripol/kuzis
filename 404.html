<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena | Kužiš</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
<meta name="theme-color" content="#FFD048">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:#171412;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;padding:18px clamp(20px,4vw,48px);border-bottom:1px solid rgba(23,18,15,.09)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.box{max-width:520px;text-align:center}
.code{font-weight:800;font-size:clamp(72px,14vw,120px);line-height:1;letter-spacing:-.03em;color:#171412;position:relative;display:inline-block}
.code::after{content:"";position:absolute;left:8%;right:8%;bottom:8px;height:18px;background:#FFD048;z-index:-1;border-radius:4px}
h1{margin:18px 0 10px;font-weight:800;font-size:clamp(20px,3.4vw,26px);letter-spacing:-.01em}
p{margin:0 0 30px;font:400 15.5px/1.65 Inter;color:rgba(23,18,15,.65)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;background:#FFD048;color:#171412;border-radius:9px;font:600 15px Inter;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(23,18,15,.2)}
.links{margin-top:22px;font:500 14px Inter}
.links a{color:rgba(23,18,15,.72);text-decoration:none;margin:0 10px}
.links a:hover{color:#171412;text-decoration:underline;text-underline-offset:4px}
</style>
</head>
<body>
<header><a href="/"><img src="/assets/logo.png" alt="Kužiš" style="height:40px;margin:-13px 0;display:block"></a></header>
<main>
<div class="box">
<div class="code">404</div>
<h1>Ova stranica ne postoji.</h1>
<p>Možda je adresa krivo utipkana ili je stranica premještena. Ali ništa strašno - sve što tražite je na dohvat ruke.</p>
<a class="btn" href="/">Natrag na početnu</a>
<div class="links"><a href="/blog">Blog</a> · <a href="/edukacije">Edukacije</a> · <a href="/kontakt">Kontakt</a></div>
</div>
</main>
</body>
</html>
